<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Arnab Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="noise-layer" aria-hidden="true"></div>

    <main class="login-shell">
        <section class="glass-card login-card">
            <p class="panel-kicker">Protected Access</p>
            <h1>Sign in to view requests</h1>
            <p class="login-copy">Only authenticated access can open the private messages inbox.</p>

            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}

            <form method="post" class="login-form">
                <input type="hidden" name="next" value="{{ next_page }}">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-submit">Login</button>
            </form>

            <a href="{{ url_for('home') }}" class="login-back">Back to portfolio</a>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
